name: Technical corporate access checks
on:
  pull_request:
    paths:
      - "src/lib/*corporate*"
      - "src/lib/server-access*"
      - "src/lib/auth-client.ts"
      - "src/app/auth/**"
      - "src/app/api/auth/**"
      - "src/app/api/internal/corporate-gate/**"
      - "src/app/login/**"
      - "src/components/auth-gate.tsx"
      - "supabase/migrations/*corporate*"
      - ".github/workflows/corporate-sso-checks.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx eslint src/lib/corporate* src/lib/server-access* src/lib/auth-client.ts src/app/auth/complete/route.ts src/app/api/auth src/app/api/internal/corporate-gate src/app/login/page.tsx src/components/auth-gate.tsx
      - run: npm test
      - run: npm run build
